name: CI for EC-CUBE Plugin

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

# 検証には tests/fixtures/SamplePlugin44 を使う。
# 従来使っていた ResizeImage4 には 4.4 対応ブランチが無く、手持ちの 4.4 対応
# プラグインは非公開リポジトリのため、この workflow からは取得できない。
# 雛形をそのまま同梱しておけば、外部リポジトリにも secrets にも依存しない。
env:
  PLUGIN_CODE: SamplePlugin44
  PLUGIN_PACKAGE_NAME: 'ec-cube/sampleplugin44'

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        eccube-versions: [ '4.4' ]
        php-versions: [ '8.2' ]
        database: [ 'mysql' ]
        include:
          - database: mysql
            database_url: mysql://root:password@127.0.0.1:3306/eccube_db
            database_server_version: 8
            database_charset: utf8mb4

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: password
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # @main ではなくチェックアウトしたものを使う。
      # そうしないと、この workflow を変更しても PR の中身が検証されない。
      - uses: ./
        with:
          plugin-directory: 'tests/fixtures/SamplePlugin44'
          plugin-code: ${{ env.PLUGIN_CODE }}
          plugin-package-name: ${{ env.PLUGIN_PACKAGE_NAME }}
          # core-tests 入力の動作確認を兼ねる
          core-tests: >-
            tests/Eccube/Tests/Web/UserDataControllerTest.php
